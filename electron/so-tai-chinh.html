<style>
/* Layout: sticky header with month switcher + tab rail; each tab is one column of cards that becomes a 2-col grid on wide screens. */
:root{
  --bg:#fff8f1; --surface:#ffffff; --surface-2:#fff0e3; --line:#f2e3d3;
  --fg:#2d2235; --muted:#7a6a77;
  --acc:#f0532a; --acc-2:#ec4899; --acc-soft:#ffe7dc;
  --inc:#22b35e; --exp:#f43f5e; --sav:#f5a524; --inv:#8b5cf6; --sky:#0ea5e9;
  --inc-ink:#15803d; --exp-ink:#e11d48; --sav-ink:#b45309; --inv-ink:#6d28d9; --acc-ink:#c2410c;
  --warn:#b45309; --bad:#e11d48; --good:#15803d;
  --shadow:0 1px 2px rgb(120 60 20/.05),0 10px 28px -12px rgb(120 60 20/.18);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121c; --surface:#221b29; --surface-2:#2d2536; --line:#3b3146;
  --fg:#f7eef5; --muted:#b9a8b8; --acc:#ff7a4d; --acc-2:#f472b6; --acc-soft:#3d2523;
  --inc:#34d27a; --exp:#fb6f86; --sav:#fbbf24; --inv:#a78bfa; --sky:#38bdf8;
  --inc-ink:#4ade80; --exp-ink:#fb7185; --sav-ink:#fcd34d; --inv-ink:#c4b5fd; --acc-ink:#ffa07a;
  --warn:#fcd34d; --bad:#fb7185; --good:#4ade80; --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 30px -14px rgb(0 0 0/.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121c; --surface:#221b29; --surface-2:#2d2536; --line:#3b3146;
  --fg:#f7eef5; --muted:#b9a8b8; --acc:#ff7a4d; --acc-2:#f472b6; --acc-soft:#3d2523;
  --inc:#34d27a; --exp:#fb6f86; --sav:#fbbf24; --inv:#a78bfa; --sky:#38bdf8;
  --inc-ink:#4ade80; --exp-ink:#fb7185; --sav-ink:#fcd34d; --inv-ink:#c4b5fd; --acc-ink:#ffa07a;
  --warn:#fcd34d; --bad:#fb7185; --good:#4ade80; --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 30px -14px rgb(0 0 0/.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:600}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.8rem}
.period{display:flex;align-items:center;gap:4px}
.period button{width:34px;height:34px}
.period .lbl{min-width:118px;text-align:center;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--acc);color:#fff}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#0d1819}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#0d1819}}
main{padding-block:16px 48px}
.view{display:grid;gap:14px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.84rem}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:759px){.kpis.k5>:last-child{grid-column:1/-1}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-size:1.25rem;font-weight:600;overflow-wrap:anywhere}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.inc .v{color:var(--inc)} .kpi.exp .v{color:var(--exp)} .kpi.sav .v{color:var(--sav)} .kpi.inv .v{color:var(--inv)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill.prio{cursor:pointer;font:inherit;font-size:.76rem;font-weight:600} .pill.prio.fixed{color:var(--sav-ink,var(--warn))} .pill.prio.flex{color:var(--good)}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.neu{color:var(--muted)}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] button.primary{color:#0d1819}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0d1819}}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.form.wide{grid-template-columns:repeat(6,minmax(0,1fr))}.form .w2{grid-column:span 2}}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;border-radius:999px;padding:5px 14px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.seg button[data-t="in"][aria-pressed="true"]{color:var(--inc)}
.seg button[data-t="out"][aria-pressed="true"]{color:var(--exp)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

#affirm.show{opacity:.95;transform:none}
@keyframes shine{to{background-position:-200% 0}}
:root.fx-off #affirm{display:none}
@media (prefers-reduced-motion:reduce){#affirm{display:none}}
#bgfx .petal{animation:fxFall var(--d) linear var(--dl) infinite}
#bgfx .petal>i{animation:fxSway 3.4s ease-in-out infinite alternate}
#bgfx .petal svg{width:var(--s);height:var(--s);animation:fxRot 5s linear infinite}
@keyframes fxFall{0%{transform:translate(var(--x0),-6vh);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translate(var(--x1),106vh);opacity:0}}
@keyframes fxSway{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
@keyframes fxRot{to{transform:rotate(360deg)}}
#wallet::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgb(252 211 77/.55),transparent 65%);z-index:-1;animation:halo 2.6s ease-in-out infinite}

#wallet{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;font-size:34px;line-height:1;pointer-events:none;filter:drop-shadow(0 6px 10px rgb(120 60 20/.25));animation:gulp 1.3s ease-in-out infinite}
@keyframes gulp{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-6deg)}}
#fxToggle{width:34px;height:34px;padding:0;font-size:1rem}
@media (prefers-reduced-motion:reduce){#bgfx,#wallet,#fxToggle{display:none}}
:root.fx-off #bgfx,:root.fx-off #wallet{display:none}

@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.data-dlg{border:0;border-radius:20px;padding:0;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--fg);box-shadow:0 30px 80px -20px rgb(0 0 0/.45)}

function compact(n){
  const a=Math.abs(n||0), s=n<0?"−":"";
  const f=(x,d)=>x.toLocaleString("vi-VN",{maximumFractionDigits:d});
  if(a>=1e9) return s+f(a/1e9,a>=1e11?0:1)+" tỷ";

  return s+f(a,0);
}
const pct = (x,d=0) => isFinite(x)? (x*100).toLocaleString("vi-VN",{maximumFractionDigits:d})+"%" : "—";
function parseMoney(v){
  if(typeof v==="number") return v;
  let s=String(v||"").trim().toLowerCase().replace(/\s/g,"");
  let mul=1;
  if(/(tỷ|ty|b)$/.test(s)){mul=1e9;s=s.replace(/(tỷ|ty|b)$/,"");}
  else if(/(triệu|trieu|tr|m)$/.test(s)){mul=1e6;s=s.replace(/(triệu|trieu|tr|m)$/,"");}
  else if(/(k|nghìn|ngan|nghin)$/.test(s)){mul=1e3;s=s.replace(/(k|nghìn|ngan|nghin)$/,"");}
  if(mul>1) s=s.replace(",",".").replace(/[^\d.]/g,""); else s=s.replace(/[^\d-]/g,"");
  const n=parseFloat(s); return isFinite(n)? Math.round(n*mul) : 0;
}
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ---------- công thức tài chính (giống Excel) ---------- */
function FV(r,n,pmt,pv){ // số dương = tiền của bạn
  if(n<=0) return pv;
  if(Math.abs(r)<1e-12) return pv+pmt*n;
  const g=Math.pow(1+r,n); return pv*g + pmt*(g-1)/r;
}
function PMT(r,n,pv,fv,due=0){ // số tiền góp mỗi kỳ để từ pv lên fv
  if(n<=0) return Math.max(0,fv-pv);
  if(Math.abs(r)<1e-12) return (fv-pv)/n;
  const g=Math.pow(1+r,n); return (fv-pv*g)*r/((g-1)*(due?1+r:1));
}

/* ---------- số liệu thu chi ---------- */
function txIn(y,m){ const k=keyYM(y,m); return S.tx.filter(t=>ym(t.date)===k); }
function monthStats(y,m){
  const list=txIn(y,m), o={inc:0,spend:0,save:0,invest:0,byInc:{},byOut:{}};
  INC_GROUPS.forEach(g=>o.byInc[g]=0); OUT_GROUPS.forEach(g=>o.byOut[g]=0);
  for(const t of list){
    if(t.t==="in"){ o.inc+=t.amount; o.byInc[t.group]=(o.byInc[t.group]||0)+t.amount; }
    else { o.byOut[t.group]=(o.byOut[t.group]||0)+t.amount; if(t.group===SAVE_GROUP) o.save+=t.amount; else if(t.group===INV_GROUP) o.invest+=t.amount; else o.spend+=t.amount; }
  }
  // khoản góp quỹ chưa được ghi ở Thu chi vẫn là tiền tiết kiệm của tháng
  const k=keyYM(y,m), txIds=new Set(S.tx.map(t=>t.id)); o.fundSave=0;
  for(const f of S.funds) for(const d of (f.deposits||[])) if(ym(d.date)===k && !(d.txId&&txIds.has(d.txId))) o.fundSave+=Number(d.amount)||0;
  o.txSave=o.save; o.save+=o.fundSave; o.byOut[SAVE_GROUP]+=o.fundSave;
  o.invDep=0; for(const v of S.invs) for(const d of (v.deposits||[])) if(ym(d.date)===k && !(d.txId&&txIds.has(d.txId))) o.invDep+=Number(d.amount)||0;
  o.txInv=o.invest; o.invest+=o.invDep; o.byOut[INV_GROUP]+=o.invDep;
  o.surplus=o.inc-o.spend-o.save-o.invest;
  o.invRate=o.inc? o.invest/o.inc : NaN;
  o.canSaveRate=o.inc? (o.inc-o.spend)/o.inc : NaN;
  o.saveRate=o.inc? o.save/o.inc : NaN;
  return o;
}
function yearStats(y){ const a=[]; for(let m=1;m<=12;m++) a.push(monthStats(y,m)); return a; }
function budgetFor(y){
  const b=S.budgets[y]; const z=()=>Array(12).fill(0);
  const base={inc:{},out:{},save:z(),invest:z()}; INC_GROUPS.forEach(g=>base.inc[g]=z()); EXP_GROUPS.forEach(g=>base.out[g]=z());
  if(!b) return base;
  INC_GROUPS.forEach(g=>{ if(Array.isArray(b.inc?.[g])) base.inc[g]=b.inc[g].map(Number); });
  EXP_GROUPS.forEach(g=>{ if(Array.isArray(b.out?.[g])) base.out[g]=b.out[g].map(Number); });
  if(Array.isArray(b.save)) base.save=b.save.map(Number);
  if(Array.isArray(b.invest)) base.invest=b.invest.map(Number);
  return base;
}

/* ---------- quỹ ---------- */
function fundCalc(f){
  const start=parseISO(f.start);
  const total = f.kind==="emergency" ? Number(f.months||6)
    : (()=>{const e=parseISO(f.end);return (e.getFullYear()-start.getFullYear())*12+e.getMonth()-start.getMonth()+1;})();
  const deadline = f.kind==="emergency" ? addMonths(start,total) : parseISO(f.end);
  const target = f.kind==="emergency" ? Number(f.fixedCost||0)*Number(f.reserveMonths||6) : Number(f.target||0);
  const rate=Number(f.rate||0);
  const deps=[...(f.deposits||[])].sort((a,b)=>a.date<b.date?-1:1);
  let bal=Number(f.initial||0), principal=bal, interest=0, last=null;
  const now = today<deadline? today : deadline;
  for(const d of deps){
    const dd=parseISO(d.date);
    if(last){ const days=Math.max(0,daysBetween(last, dd<now?dd:now)); const i=bal*rate/365*days; bal+=i; interest+=i; }
    bal+=Number(d.amount); principal+=Number(d.amount); last=dd;
  }
  if(last && now>last){ const i=bal*rate/365*daysBetween(last,now); bal+=i; interest+=i; }
  const monthsDone=new Set(deps.filter(d=>d.amount>0).map(d=>ym(d.date))).size;
  const remaining=Math.max(0,total-monthsDone);
  const done=bal>=target && target>0;
  const need = done?0 : remaining>0 ? Math.ceil(Math.max(0,PMT(rate/12,remaining,bal,target,1))/1000)*1000 : Math.ceil(Math.max(0,target-bal)/1000)*1000;
  const withdraw = f.method==="Ngân hàng"? principal+interest : f.method==="MMF"? (principal+interest)*.999 : principal+interest*.95;
  return {total,deadline,target,bal,principal,interest,remaining,done,need,withdraw,progress:target?Math.min(1,bal/target):0,deps};
}

/* ---------- cân đối quỹ tiết kiệm ---------- */
const isFixed = f => (f.priority ?? (f.kind==="emergency"?"fixed":"flex")) === "fixed";
function monthsToReach(bal,target,rate,pmt){ // góp đầu tháng, số tháng tối thiểu để đạt mục tiêu
  if(bal>=target) return 0; if(pmt<=0) return Infinity;
  let b=bal; for(let n=1;n<=600;n++){ b=(b+pmt)*(1+rate/12); if(b>=target-0.5) return n; } return Infinity; }
function balancePlan(rows, idle){
  const act=rows.filter(x=>!x.c.done);
  const fixed=act.filter(x=>isFixed(x.f)), flex=act.filter(x=>!isFixed(x.f));
  const fixedNeed=fixed.reduce((s,x)=>s+x.c.need,0), flexNeed=flex.reduce((s,x)=>s+x.c.need,0);
  const left=Math.max(0,idle-fixedNeed), short=fixedNeed+flexNeed-idle;
  const k=flexNeed? Math.min(1,left/flexNeed) : 1;
  const sug=flex.map(x=>{ const {f,c}=x; const pay=k>=1? c.need : Math.floor(c.need*k/1000)*1000;
    const n=monthsToReach(c.bal,c.target,Number(f.rate||0),pay);
    const base=c.remaining>0? c.deadline : (today>c.deadline? today : c.deadline);
    const extra= k>=1? 0 : (isFinite(n)? n-c.remaining : Infinity);

// Lãi năm → lãi tháng tương đương (gửi kỳ hạn 12 tháng tái tục: 9,1%/năm ≈ 0,73%/tháng)

  if(v.target&&c.value<v.target&&(pay>0||r>0)){ let b=c.value,n=0; while(b<v.target&&n<720){ b=(b+pay)*(1+r); n++; } out.reachN=n<720?n:null; out.reachDate=n<720?addMonths(new Date(today.getFullYear(),today.getMonth(),1),n):null; }
  return out; }

function invBalancePlan(rows, idle){

/* ---------- kế hoạch hưu trí ---------- */
function retireCalc(p){
  const yearsToRetire=p.retireAge-p.age;
  const annual=p.monthlySpend*12;
  const needFromInv=annual-(p.pension+p.other)*12;
  const totalIncome=needFromInv+(p.pension+p.other)*12;
  const inflAdj=totalIncome*Math.pow(1+p.inflation,yearsToRetire);
  const withdrawPre= totalIncome? inflAdj/(1-p.tax)*(needFromInv/totalIncome) : 0;
  const target= p.withdrawRate? withdrawPre/p.withdrawRate : 0;
  return {yearsToRetire,annual,needFromInv,inflAdj,inflMonthly:inflAdj/12,withdrawPre,withdrawPost:withdrawPre*(1-p.tax),target,
    perYear:PMT(p.rate,yearsToRetire,p.invested,target),perMonth:PMT(p.rate/12,yearsToRetire*12,p.invested,target),perWeek:PMT(p.rate/52,yearsToRetire*52,p.invested,target)};
}
function stagesCalc(p){
  const sc=p.scenarios?.[p.scenario]||{stages:[]}; const ppy=p.freq==="month"?12:52;
  let from=p.age, bal=p.invested; const out=[]; const yearly=[{age:p.age,bal}];
  for(const st of sc.stages){
    const to=Math.max(from,Number(st.to)); const pv=bal+Number(st.lump||0);
    const n=(to-from+1)*ppy, r=Number(st.growth)/ppy, pmt=Number(st.pmt||0);
    const fv=FV(r,n,pmt,pv);
    let b=pv; for(let a=from;a<=to;a++){ b=FV(r,ppy,pmt,b); yearly.push({age:a+1,bal:b}); }
    out.push({...st,from,to,pv,n,contrib:pmt*n,fv,interest:fv-pv-pmt*n});
    bal=fv; from=to+1;
  }
  return {stages:out,yearly,end:bal,ppy};
}

/* ---------- danh mục đầu tư ---------- */
function invCalc(v){
  const deps=[...(v.deposits||[])].sort((a,b)=>a.date<b.date?-1:1), vals=[...(v.valuations||[])].sort((a,b)=>a.date<b.date?-1:1);
  const principal=Number(v.initial||0)+deps.reduce((a,d)=>a+Number(d.amount),0);
  const lv=vals.at(-1); const value= lv? Number(lv.value)+deps.filter(d=>d.date>lv.date).reduce((a,d)=>a+Number(d.amount),0) : principal;
  const gain=value-principal;
  return {deps,vals,lv,principal,value,gain,gainPct:principal?gain/principal:NaN,progress:v.target?Math.min(1,value/v.target):null};
}
function portfolio(){ const rows=S.invs.map(v=>({v,c:invCalc(v)})); return {rows,value:rows.reduce((a,x)=>a+x.c.value,0),principal:rows.reduce((a,x)=>a+x.c.principal,0)}; }
function planNow(p){ // kế hoạch đến hôm nay: góp bao nhiêu, giá trị bao nhiêu
  const st=stagesCalc(p), ppy=st.ppy; const start=parseISO(p.startDate||iso(today));
  const days=Math.max(0,daysBetween(start,today)); let left= ppy===52? Math.floor(days/7) : (today.getFullYear()-start.getFullYear())*12+today.getMonth()-start.getMonth();
  let bal=Number(p.invested||0), contrib=bal;
  for(const s of st.stages){ if(left<=0) break; const k=Math.min(s.n,left); bal=FV(s.growth/ppy,k,s.pmt,bal+Number(s.lump||0)); contrib+=s.pmt*k; left-=k; }
  const cur=st.stages.find(s=>p.age>=s.from&&p.age<=s.to)||st.stages[0];
  return {contrib,value:bal,cur,monthNeed:cur?Math.round(cur.pmt*ppy/12/1000)*1000:0,ppy};
}
function investNeed(){ const p=S.plan||DEFAULT_PLAN; return Math.round(planNow(p).monthNeed); }

function avgMonthly(k){ const ys=yearStats(S.y).filter(s=>s.inc||s.spend||s.save||s.invest); return ys.length? ys.reduce((a,s)=>a+s[k],0)/ys.length : 0; }

  return {map,cur:b,ob}; }

        <tr class="total"><td>Tổng chi</td><td class="r num">${vn(pOut)}</td><td class="r num">${vn(ms.spend)}</td><td class="r num" style="color:${ms.spend>pOut&&pOut?"var(--bad)":"inherit"}">${vn(ms.spend-pOut)}</td></tr>

        ${(()=>{const p=pInc-pOut-bud.save[i]-bud.invest[i],a=ms.inc-ms.spend-ms.save-ms.invest, sp=pInc-pOut;
          const warn=[]; if(sp<0) warn.push(`<b>Dự kiến:</b> chi (${vnd(pOut)}) lớn hơn thu (${vnd(pInc)}) <b class="num">${vnd(-sp)}</b>, tháng này không có thặng dư.`);

      </tbody></table></div>

  return `${part("Tiết kiệm",need,iS)}<br>${part("Đầu tư",invNeed,iI)}${(need>iS||invNeed>iI)?"<br>Cách xử lý: giảm số tiền mục tiêu, kéo dài hạn của quỹ, giảm mức góp của giai đoạn, hoặc chuyển bớt tiền nhàn rỗi từ phần đang dư sang phần đang thiếu.":""}`;
}

function stageBar(s){
  const pfv=portfolio().value, p=S.plan, isCur=p.age>=s.from&&p.age<=s.to, past=p.age>s.to;
  if(past) return "";
  const pn=isCur?planNow(p):null, w=Math.min(100,pfv/s.fv*100), mk=pn?Math.min(100,pn.value/s.fv*100):null;
  return `<div class="out stack" style="gap:4px"><div class="bar inv" style="height:10px"><i style="width:${Math.max(.5,w).toFixed(2)}%"></i>${mk!==null?`<span class="mark" style="left:${mk.toFixed(2)}%"></span>`:""}</div>
    <span>${isCur?`<b>Giai đoạn hiện tại.</b> `:""}Danh mục thực tế <b class="num">${compact(pfv)}</b> = ${pct(pfv/s.fv,1)} số tiền cuối giai đoạn${isCur?`, kế hoạch đến hôm nay là ${compact(pn.value)} (vạch đen)`:""}.</span></div>`;
}

function goldBlock(v,c){
  const id=esc(v.id), sell=Number(v.goldSell||0), buy=Number(v.goldBuy||0), q=goldQty(v), need=invNeedOf(v,c);
  const facts=[];
  if(sell){ facts.push(`💰 Mua 1 chỉ cần <b class="num">${vnd(sell)}</b> · 1 lượng (10 chỉ) cần <b class="num">${compact(sell*10)}</b>`);
    if(v.target) facts.push(`🎯 Mục tiêu ${compact(v.target)} ≈ <b class="num">${chi(v.target/sell)} chỉ</b>${q?(q>=v.target/sell?`, <b style="color:var(--good)">đã đủ</b>`:`, còn thiếu <b class="num">${chi(v.target/sell-q)} chỉ</b>`):""}`);
    if(need) facts.push(`📅 Góp ${compact(need)}/tháng ≈ <b class="num">${chi(need/sell)} chỉ/tháng</b>${need<sell?`, cứ khoảng <b class="num">${Math.ceil(sell/need)} tháng</b> mua được 1 chỉ`:""}`);
    else facts.push(`📅 Muốn mỗi tháng có 1 chỉ thì cần góp <b class="num">${vnd(sell)}</b>/tháng`); }
  if(q){ facts.push(`🥇 Đang giữ <b class="num">${chi(q)} chỉ</b> = ${chi(q*3.75)} g = ${chi(q/10)} lượng${buy?`, bán ngay được ≈ <b class="num">${vnd(q*buy)}</b>`:""}`);
    const depQ=(v.deposits||[]).reduce((a,d)=>a+Number(d.qty||0),0);
    if(c.principal&&!Number(v.initial)&&Math.abs(depQ-q)<0.01) facts.push(`🧮 Giá vốn bình quân <b class="num">${vnd(c.principal/q)}</b>/chỉ${buy?` (${buy>=c.principal/q?"đang lãi":"đang lỗ"} ${vnd(Math.abs(buy-c.principal/q))}/chỉ so với giá mua vào)`:""}`); }
  return `<div class="gold-box">
    <div class="row"><b>🥇 Quy đổi ra chỉ vàng${T("gold")}</b><span class="hint">${v.goldDate?`giá ngày ${dmy(v.goldDate)}`:"nhập giá để quy đổi"} · tra: ${REF_LINKS[0].l.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${n}</a>`).join(", ")}</span></div>
    <div class="form gold-in">
      <label class="f">${L("Giá bán ra / chỉ","goldSell")}<input data-gold="goldSell|${id}" data-money inputmode="decimal" value="${sell?vn(sell):""}" placeholder="vd 15tr"></label>
      <label class="f">${L("Giá mua vào / chỉ","goldBuy")}<input data-gold="goldBuy|${id}" data-money inputmode="decimal" value="${buy?vn(buy):""}" placeholder="vd 14,8tr"></label>
      <label class="f">${L("Số chỉ đang giữ","goldQty")}<input data-gold="goldQty|${id}" inputmode="decimal" value="${q?chi(q):""}" placeholder="0"></label>
    </div>
    ${facts.length?`<ul class="gold-facts">${facts.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<div class="hint">Nhập giá bán ra 1 chỉ để xem cần bao nhiêu tiền cho 1 chỉ, mục tiêu tương đương bao nhiêu chỉ.</div>`}
    ${q&&buy?`<button data-gold-val="${id}">Cập nhật giá trị = ${chi(q)} chỉ × giá mua vào (${compact(q*buy)})</button>`:""}
  </div>`;
}

function planSeries(p){ // giá trị kế hoạch theo từng tháng tuổi
  const st=stagesCalc(p), ppy=st.ppy, out=[]; let bal=Number(p.invested||0);
  for(const s of st.stages){ const pv=bal+Number(s.lump||0), months=(s.to-s.from+1)*12;
    for(let m=0;m<=months;m++) out.push({x:s.from+m/12,y:FV(s.growth/ppy,m*ppy/12,s.pmt,pv)}); bal=s.fv; }
  return out;
}
function valueAt(date){ let tot=0; const d0=iso(date);
  for(const v of S.invs){ const deps=(v.deposits||[]).filter(d=>d.date<=d0), vals=(v.valuations||[]).filter(x=>x.date<=d0).sort((a,b)=>a.date<b.date?-1:1), lv=vals.at(-1);
    tot+= lv? Number(lv.value)+deps.filter(d=>d.date>lv.date).reduce((a,d)=>a+Number(d.amount),0) : Number(v.initial||0)+deps.reduce((a,d)=>a+Number(d.amount),0); }
  return tot; }
function actualSeries(p){ // danh mục thực tế, mỗi cuối tháng từ ngày bắt đầu kế hoạch
  const start=parseISO(p.startDate||iso(today)), out=[]; const ageAt=d=>p.age+daysBetween(start,d)/365.25;
  out.push({x:p.age,y:valueAt(new Date(start.getTime()-864e5))});
  for(let d=new Date(start.getFullYear(),start.getMonth()+1,0); d<today; d=new Date(d.getFullYear(),d.getMonth()+2,0)) out.push({x:ageAt(d),y:valueAt(d)});
  out.push({x:ageAt(today),y:valueAt(today)}); return out;
}

function drawSims(full){
  const s=S.sim;
  // 1. thu chi -> tài sản
  const monthly=Math.max(0,(s.inc-s.exp)*s.share); const r=s.rate/12; const L=[],C=[],V=[],R=[];
  for(let y=0;y<=s.years;y++){ L.push("Năm "+y); C.push(monthly*12*y); const v=FV(r,y*12,monthly,0); V.push(v); R.push(v/Math.pow(1+s.infl,y)); }
  const fin=V.at(-1), con=C.at(-1);
  $("#simSum1").innerHTML=`<div><span class="hint lt">Đầu tư mỗi tháng${T("m1")}</span><b class="big num">${compact(monthly)}</b><span class="hint">${s.inc>s.exp?`thặng dư ${compact(s.inc-s.exp)}`:"chi đang vượt thu"}</span></div>
    <div><span class="hint lt">Sau ${s.years} năm có${T("m2")}</span><b class="big num">${compact(fin)}</b><span class="hint">trong đó lãi ${compact(fin-con)}</span></div>
    <div><span class="hint lt">Sức mua hôm nay${T("m3")}</span><b class="big num">${compact(R.at(-1))}</b><span class="hint">đã trừ lạm phát ${pct(s.infl,1)}/năm</span></div>`;
  const ds1=[{label:"Tiền gốc đã góp",data:C,borderColor:css("--muted"),backgroundColor:css("--surface-2"),fill:true,pointRadius:0},
    {label:"Tổng tài sản",data:V,borderColor:css("--acc"),fill:true,pointRadius:0,borderWidth:3},
    {label:"Theo sức mua hôm nay",data:R,borderColor:css("--sav"),borderDash:[6,4],pointRadius:0,backgroundColor:css("--sav")}];
  upd("cSim1",{type:"line",data:{labels:L,datasets:ds1},options:{interaction:{mode:"index",intersect:false}}},full);
  // 2. bắt đầu sớm hay muộn
  const starts=[s.start,s.start+10,s.start+20].filter(a=>a<s.retire); const ages=[]; for(let a=18;a<=s.retire;a++) ages.push(a);

function groupDigits(el){
  const v=el.value; if(/[a-zà-ỹ]/i.test(v)||/[.,]\d{0,2}$/.test(v)) return; // đang gõ kiểu 50k, 1.5tr: để nguyên
  const caret=el.selectionStart??v.length; const before=v.slice(0,caret).replace(/\D/g,"").length;
  const neg=el.hasAttribute("data-signed")&&/^\s*[-−]/.test(v);
  let d=v.replace(/\D/g,"").replace(/^0+(?=\d)/,"");
  const out=(neg?"-":"")+d.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  if(out===v) return; el.value=out;
  let pos=neg?1:0, seen=0; while(pos<out.length&&seen<before){ if(/\d/.test(out[pos])) seen++; pos++; }
  try{ el.setSelectionRange(pos,pos); }catch(e){}
}

  // ---- mã hoá: PBKDF2-SHA256 + AES-GCM 256 ----
  const ITER=310000, TE=new TextEncoder(), TD=new TextDecoder();
  let cKey=null, cSalt=null;
  const b64=u=>{ let s=""; const a=new Uint8Array(u); for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); };
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function derive(pw,salt,iter=ITER){ const base=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
  async function seal(obj){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},cKey,TE.encode(JSON.stringify(obj)));
    return {kdf:"PBKDF2-SHA256",iter:ITER,salt:b64(cSalt),iv:b64(iv),ct:b64(ct)}; }
  async function unseal(enc,pw){ const salt=unb64(enc.salt), key=await derive(pw,salt,enc.iter||ITER);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(enc.iv)},key,unb64(enc.ct)); cKey=key; cSalt=salt; return JSON.parse(TD.decode(pt)); }
  async function setPassword(pw){ cSalt=crypto.getRandomValues(new Uint8Array(16)); cKey=await derive(pw,cSalt); }
  function lockScreen(mode,err){ return new Promise(res=>{
    let el=document.getElementById("lock"); if(!el){ el=document.createElement("div"); el.id="lock"; document.body.appendChild(el); }
    const create=mode!=="unlock";
    el.innerHTML=`<form class="lock-card" autocomplete="off">
      <div class="lock-cat">${typeof catSVG==="function"?catSVG(create?"happy":"cheer"):""}</div>
      <h2>${mode==="change"?"Đổi mật khẩu":create?"Đặt mật khẩu cho app":"Sổ Thu Chi & Đầu Tư"}</h2>
      <p class="hint">${create?"Dữ liệu sẽ được mã hoá bằng mật khẩu này. <b>Nếu quên mật khẩu sẽ không mở lại được dữ liệu</b>, hãy ghi nhớ thật kỹ.":"Nhập mật khẩu để mở khoá dữ liệu của bạn."}</p>
      <input type="password" name="p1" placeholder="Mật khẩu" aria-label="Mật khẩu" autofocus>
      ${create?`<input type="password" name="p2" placeholder="Nhập lại mật khẩu" aria-label="Nhập lại mật khẩu">`:""}
      <div class="lock-err" role="alert">${err||""}</div>
      <button class="primary" type="submit">${create?"Lưu mật khẩu":"Mở khoá"}</button>
      ${mode==="change"?`<button type="button" data-cancel>Huỷ</button>`:""}
    </form>`;
    el.hidden=false; const f=el.querySelector("form"); setTimeout(()=>f.p1.focus(),30);
    const cancel=el.querySelector("[data-cancel]"); if(cancel) cancel.onclick=()=>{ el.hidden=true; res(null); };
    f.onsubmit=e=>{ e.preventDefault(); const p1=f.p1.value, p2=f.p2?.value;
      if(create&&p1.length<4){ el.querySelector(".lock-err").textContent="Mật khẩu cần ít nhất 4 ký tự"; return; }
      if(create&&p1!==p2){ el.querySelector(".lock-err").textContent="Hai lần nhập không khớp"; return; }
      if(!p1) return; el.querySelector(".lock-err").textContent="Đang xử lý…"; res(p1); };
  }); }
  const hideLock=()=>{ const el=document.getElementById("lock"); if(el) el.hidden=true; };
  const api={
    collection:c=>({onSnapshot:(fn)=>{ (colL[c]=colL[c]||[]).push(fn); setTimeout(()=>fn({docs:Object.entries(D[c]||{}).map(([i,d])=>docSnap(i,d))}),0); return()=>{}; }}),
    doc:path=>{ const [c,i]=path.split("/"); return {
      onSnapshot:(fn)=>{ (docL[path]=docL[path]||[]).push(fn); setTimeout(()=>fn(docSnap(i,(D[c]||{})[i])),0); return()=>{}; },
      set:async data=>{ (D[c]=D[c]||{})[i]=clone(data); persist(); setTimeout(()=>{ emitCol(c); emitDoc(path,true); },0); },
      delete:async()=>{ if(D[c]) delete D[c][i]; persist(); setTimeout(()=>{ emitCol(c); emitDoc(path,false); },0); } }; }
  };
  async function bindHandle(h){ handle=h; await kv("file",h); fileState="ok"; }
  return {
    info, onState:fn=>{ stateL.push(fn); fn(info()); },
    async open(initial){
      if(isNative){ native=await waitNative(); }
      if(native){
        nativePath=await native.path(); fileState="native";
        const txt=await native.load(); const j=txt?JSON.parse(txt):null;
        if(j&&j.enc){ let err="";
          for(;;){ const pw=await lockScreen("unlock",err); try{ D=norm(await unseal(j.enc,pw)); break; }catch(e){ err="Sai mật khẩu, thử lại nhé"; } }
          fileSavedAt=savedAt=j.savedAt||null; }
        else {
          const legacyLocal=loadLocal();
          D= j? readPayload(txt).data : (legacyLocal?.data||norm(clone(initial||{})));
          await setPassword(await lockScreen("create"));
          await writeFile(); }
        hideLock(); saveLocal(); return api;
      }
      const loc=loadLocal(); D=loc?.data||null; savedAt=loc?.savedAt||null;
      if(canFS){ const h=await kv("file");
        if(h){ handle=h; let perm="prompt"; try{ perm=await h.queryPermission({mode:"readwrite"}); }catch(e){}
          if(perm==="granted"){ try{ const f=await (await h.getFile()).text(); const p=readPayload(f); fileState="ok"; fileSavedAt=p.savedAt;
              if(!D || (p.savedAt&&(!savedAt||p.savedAt>savedAt))){ D=p.data; saveLocal(); } }catch(e){ console.warn(e); fileState="error"; } }
          else fileState="permission"; } }
      if(!D){ D=norm(clone(initial||{})); saveLocal(); }
      return api;
    },
    async reconnect(){ if(!handle) return false; const p=await handle.requestPermission({mode:"readwrite"}); if(p!=="granted") return false;
      try{ const f=readPayload(await (await handle.getFile()).text()); if(f.savedAt&&(!savedAt||f.savedAt>savedAt)){ D=f.data; saveLocal(); emitAll(); } }catch(e){}
      fileState="ok"; await writeFile(); return true; },
    async chooseSave(){ const h=await window.showSaveFilePicker({suggestedName:"so-tai-chinh-data.json",types:[{description:"Dữ liệu Sổ Thu Chi",accept:{"application/json":[".json"]}}]});
      await bindHandle(h); await writeFile(); return true; },
    async chooseOpen(){ const [h]=await window.showOpenFilePicker({types:[{description:"Dữ liệu Sổ Thu Chi",accept:{"application/json":[".json"]}}]});
      const p=readPayload(await (await h.getFile()).text()); if((await h.requestPermission({mode:"readwrite"}))!=="granted") throw new Error("Chưa cho phép ghi file");
      D=p.data; saveLocal(); await bindHandle(h); emitAll(); await writeFile(); return true; },
    async forget(){ handle=null; await kv("file",null); fileState=canFS?"none":"unsupported"; notify(); },
    async exportNative(){ if(!native) return false; const p=payload(); return await native.export_backup(JSON.stringify({app:p.app,version:2,savedAt:p.savedAt,enc:await seal(p.data)},null,1)); },
    async changePassword(){ const pw=await lockScreen("change"); if(!pw) return false; await setPassword(pw); await writeFile(); hideLock(); return true; },
    async openFolder(){ if(native) await native.open_folder(); },
    download(){ if(native) return this.exportNative(); const b=new Blob([JSON.stringify(payload(),null,1)],{type:"application/json"}); const a=document.createElement("a"); const d=new Date();
      a.href=URL.createObjectURL(b); a.download=`so-tai-chinh-sao-luu-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); },
    async importText(txt){ const j=JSON.parse(txt);
      if(j&&j.enc){ let err=""; for(;;){ const pw=await lockScreen("unlock",err||"Nhập mật khẩu của bản sao lưu này"); try{ D=norm(await unseal(j.enc,pw)); break; }catch(e){ err="Sai mật khẩu, thử lại nhé"; } } hideLock(); }
      else D=readPayload(txt).data;
      persist(); emitAll(); }
  };
})();

/* ---------- bảng quản lý dữ liệu ---------- */
const fmtTime=s=>{ if(!s) return "chưa có"; const d=new Date(s); return d.toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",year:"numeric"}); };
function renderDataUI(st){
  if(st.native){
    setSync(st.fileState==="error"?"⚠️ không ghi được file":`đã lưu vào file lúc ${fmtTime(st.fileSavedAt).split(" ")[0]}`);
    $("#fileBanner").hidden=st.fileState!=="error"; $("#fileBanner").innerHTML=st.fileState==="error"?`<span>⚠️ Không ghi được file dữ liệu. Kiểm tra thư mục của app có bị khoá hoặc đầy ổ đĩa không.</span>`:"";
    $("#dataBody").innerHTML=`
      <div class="stack" style="gap:6px">
        <div><span class="hint">File dữ liệu</span><div class="num" style="overflow-wrap:anywhere;font-size:.85rem">${esc(st.fileName||"")}</div></div>
        <div class="row"><span class="hint">Lần lưu gần nhất</span><span class="num hint">${fmtTime(st.fileSavedAt)}</span></div>
      </div>
      <div class="stack">
        <button data-act="lock">🔒 Khoá app ngay</button>
        <button data-act="passwd">Đổi mật khẩu</button>
        <button data-act="folder">Mở thư mục dữ liệu</button>
        <button data-act="download">Xuất bản sao lưu…</button>
        <label class="btn" style="text-align:center">Nhập từ bản sao lưu…<input id="impFile" type="file" accept=".json,application/json" hidden></label>
      </div>
      <div class="hint">🔐 File dữ liệu và bản sao lưu đều được mã hoá bằng mật khẩu của bạn (AES-256). Mỗi thay đổi tự ghi vào file sau nửa giây. Mỗi ngày app tự giữ một bản sao trong thư mục <b>sao-luu</b> (30 ngày gần nhất).</div>`;
    return;
  }
  setSync(st.fileState==="ok"? `đã lưu vào file lúc ${fmtTime(st.fileSavedAt).split(" ")[0]}` : "đã lưu trong trình duyệt");
  const b=$("#fileBanner");
  const msg = st.fileState==="permission"? `<span>🔒 Bấm để tiếp tục tự động lưu vào file <b>${esc(st.fileName||"")}</b>.</span><button class="primary" data-act="reconnect">Tiếp tục lưu vào file</button>`
    : st.fileState==="none"? `<span>💾 Dữ liệu đang lưu trong trình duyệt. Chọn một file trên ổ đĩa để lưu, sẽ an toàn hơn khi xoá lịch sử trình duyệt.</span><button class="primary" data-act="save">Chọn nơi lưu file</button>`
    : st.fileState==="error"? `<span>⚠️ Không đọc hoặc ghi được file <b>${esc(st.fileName||"")}</b>. File có thể đã bị đổi tên hoặc di chuyển.</span><button class="primary" data-act="open">Chọn lại file</button>`
    : "";
  b.hidden=!msg; b.innerHTML=msg;
  $("#dataBody").innerHTML=`
    <div class="stack" style="gap:6px">
      <div class="row"><span>🧭 Trong trình duyệt</span><b class="num">${fmtTime(st.savedAt)}</b></div>
      <div class="row"><span>💾 File trên ổ đĩa</span><b>${st.fileState==="ok"||st.fileState==="permission"||st.fileState==="error"? esc(st.fileName||"") : st.canFS? "chưa chọn" : "trình duyệt không hỗ trợ"}</b></div>
      ${st.fileState==="ok"?`<div class="row"><span class="hint">Lần ghi file gần nhất</span><span class="num hint">${fmtTime(st.fileSavedAt)}</span></div>`:""}
    </div>
    ${st.canFS?`<div class="stack">
      ${st.fileState==="permission"?`<button class="primary" data-act="reconnect">Cấp lại quyền ghi file</button>`:""}
      <button ${st.fileState==="ok"?"":'class="primary"'} data-act="save">Chọn nơi lưu file mới…</button>
      <button data-act="open">Mở file dữ liệu có sẵn…</button>
      ${st.fileName?`<button class="ghost" data-act="forget">Ngừng dùng file này</button>`:""}
    </div>`:`<div class="note">Trình duyệt này chưa hỗ trợ tự lưu ra file. Hãy dùng Chrome hoặc Edge, hoặc bấm “Tải bản sao lưu” thường xuyên.</div>`}
    <div class="stack" style="border-top:1px solid var(--line);padding-top:12px">
      <button data-act="download">Tải bản sao lưu (.json)</button>
      <label class="btn" style="text-align:center">Nhập từ bản sao lưu…<input id="impFile" type="file" accept=".json,application/json" hidden></label>
    </div>
    <div class="hint">Mỗi thay đổi tự lưu ngay vào trình duyệt và ghi ra file sau nửa giây. Nên đặt file trong thư mục SoTaiChinh hoặc OneDrive để có thêm bản sao.</div>`;
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],#dataBtn,#dataClose"); if(!t) return; e.stopPropagation();
  const dlg=$("#dataDlg");
  if(t.id==="dataBtn"){ renderDataUI(LocalDB.info()); dlg.showModal?dlg.showModal():dlg.setAttribute("open",""); return; }
  if(t.id==="dataClose"){ dlg.close?dlg.close():dlg.removeAttribute("open"); return; }
  try{
    const a=t.dataset.act;
    if(a==="reconnect"){ if(await LocalDB.reconnect()) toast("Đã kết nối lại file dữ liệu"); }
    else if(a==="save"){ await LocalDB.chooseSave(); toast("Từ giờ dữ liệu tự lưu vào file này"); }
    else if(a==="open"){ if(!confirm("Mở file này sẽ thay dữ liệu đang hiển thị bằng dữ liệu trong file. Tiếp tục?")) return; await LocalDB.chooseOpen(); toast("Đã mở file dữ liệu"); }
    else if(a==="forget"){ await LocalDB.forget(); toast("Đã ngừng dùng file, dữ liệu vẫn còn trong trình duyệt"); }
    else if(a==="download"){ const r=await LocalDB.download(); if(r!==false) toast("Đã lưu bản sao lưu"); }
    else if(a==="folder"){ await LocalDB.openFolder(); }
    else if(a==="lock"){ location.reload(); return; }
    else if(a==="passwd"){ $("#dataDlg").close?.(); if(await LocalDB.changePassword()) toast("Đã đổi mật khẩu"); return; }
  }catch(err){ if(err&&err.name==="AbortError") return; console.warn(err); toast(err.message||"Không thực hiện được"); }
  renderDataUI(LocalDB.info());
},true);
document.addEventListener("change",async e=>{
  if(e.target.id!=="impFile"||!e.target.files[0]) return;
  if(!confirm("Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu này?")){ e.target.value=""; return; }
  try{ await LocalDB.importText(await e.target.files[0].text()); toast("Đã nhập dữ liệu từ bản sao lưu"); renderDataUI(LocalDB.info()); }
  catch(err){ toast("File không đúng định dạng sao lưu"); }
  e.target.value="";
});

(async()=>{
  const db = await LocalDB.open(INITIAL_DATA).catch(e=>{ console.error(e); return null; });
  if(!db){ setSync("chưa kết nối"); const b=$("#dbBanner"); b.hidden=false; b.textContent="Không mở được kho dữ liệu trên máy. Hãy thử mở bằng Chrome hoặc Edge."; return; }
  S.db=db; LocalDB.onState(renderDataUI);
  const err=e=>{ console.warn(e); setSync("mất kết nối"); };
  db.collection("investments").onSnapshot(snap=>{ S.invs=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0)); render(); },err);
  db.collection("tx").onSnapshot(snap=>{ S.tx=snap.docs.map(d=>{const x={id:d.id,...d.data(),amount:Number(d.data().amount)||0}; if(x.group===LEGACY_SAVE) x.group=SAVE_GROUP; return x;}); S.loaded.tx=true; render(); },err);
  db.collection("funds").onSnapshot(snap=>{ S.funds=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id})); sortFunds(); render(); },err);
  db.collection("budget").onSnapshot(snap=>{ S.budgets={}; snap.docs.forEach(d=>S.budgets[d.id]=JSON.parse(JSON.stringify(d.data()))); render(); },err);
  db.doc("cfg/settings").onSnapshot(d=>{ if(d.exists) S.settings=Object.assign({idle:4500000},d.data()); render(); },err);
  db.doc("cfg/plan").onSnapshot(d=>{
    if(d.metadata.hasPendingWrites) return;
    if(d.exists){ const v=JSON.parse(JSON.stringify(d.data())); S.plan=Object.assign(JSON.parse(JSON.stringify(DEFAULT_PLAN)),v); }
    const a=document.activeElement; if(a&&(a.dataset?.plan||a.dataset?.stage!==undefined)) return; render();
  },err);
})();
})();
