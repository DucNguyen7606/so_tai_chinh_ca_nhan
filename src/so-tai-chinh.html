<style>
/* Layout: sticky header with month switcher + tab rail; each tab is one column of cards that becomes a 2-col grid on wide screens. */
:root{
  --bg:#fff8f1; --surface:#ffffff; --surface-2:#fff0e3; --line:#f2e3d3;
  --fg:#2d2235; --muted:#7a6a77;
  --acc:#f0532a; --acc-2:#ec4899; --acc-soft:#ffe7dc;
  --inc:#22b35e; --exp:#f43f5e; --sav:#f5a524; --inv:#8b5cf6; --sky:#0ea5e9;
  --inc-ink:#15803d; --exp-ink:#e11d48; --sav-ink:#b45309; --inv-ink:#6d28d9; --acc-ink:#c2410c;
  --warn:#b45309; --bad:#e11d48; --good:#15803d;
  --shadow:0 1px 2px rgb(120 60 20/.05),0 10px 28px -12px rgb(120 60 20/.18);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121c; --surface:#221b29; --surface-2:#2d2536; --line:#3b3146;
  --fg:#f7eef5; --muted:#b9a8b8; --acc:#ff7a4d; --acc-2:#f472b6; --acc-soft:#3d2523;
  --inc:#34d27a; --exp:#fb6f86; --sav:#fbbf24; --inv:#a78bfa; --sky:#38bdf8;
  --inc-ink:#4ade80; --exp-ink:#fb7185; --sav-ink:#fcd34d; --inv-ink:#c4b5fd; --acc-ink:#ffa07a;
  --warn:#fcd34d; --bad:#fb7185; --good:#4ade80; --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 30px -14px rgb(0 0 0/.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121c; --surface:#221b29; --surface-2:#2d2536; --line:#3b3146;
  --fg:#f7eef5; --muted:#b9a8b8; --acc:#ff7a4d; --acc-2:#f472b6; --acc-soft:#3d2523;
  --inc:#34d27a; --exp:#fb6f86; --sav:#fbbf24; --inv:#a78bfa; --sky:#38bdf8;
  --inc-ink:#4ade80; --exp-ink:#fb7185; --sav-ink:#fcd34d; --inv-ink:#c4b5fd; --acc-ink:#ffa07a;
  --warn:#fcd34d; --bad:#fb7185; --good:#4ade80; --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 30px -14px rgb(0 0 0/.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:600}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.8rem}
.period{display:flex;align-items:center;gap:4px}
.period button{width:34px;height:34px}
.period .lbl{min-width:118px;text-align:center;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}

nav.tabs button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--acc);color:#fff}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#0d1819}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#0d1819}}
main{padding-block:16px 48px}
.view{display:grid;gap:14px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.84rem}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}

@media (max-width:759px){.kpis.k5>:last-child{grid-column:1/-1}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-size:1.25rem;font-weight:600;overflow-wrap:anywhere}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.inc .v{color:var(--inc)} .kpi.exp .v{color:var(--exp)} .kpi.sav .v{color:var(--sav)} .kpi.inv .v{color:var(--inv)}

.pill.prio{cursor:pointer;font:inherit;font-size:.76rem;font-weight:600} .pill.prio.fixed{color:var(--sav-ink,var(--warn))} .pill.prio.flex{color:var(--good)}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.neu{color:var(--muted)}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] button.primary{color:#0d1819}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0d1819}}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.form.wide{grid-template-columns:repeat(6,minmax(0,1fr))}.form .w2{grid-column:span 2}}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;border-radius:999px;padding:5px 14px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.seg button[data-t="in"][aria-pressed="true"]{color:var(--inc)}
.seg button[data-t="out"][aria-pressed="true"]{color:var(--exp)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr.total td{font-weight:700;border-bottom:0}
.alloc-warn{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--fg);font-size:.88rem;line-height:1.5}
td input.over{border-color:var(--bad)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 25%,transparent)}
tr.surplus td{background:color-mix(in srgb,var(--good) 10%,transparent);border-top:2px solid color-mix(in srgb,var(--good) 35%,transparent)}
td input{padding:5px 8px;text-align:right}
.list{display:grid}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .n{font-weight:600;overflow-wrap:anywhere}
.tx .m{font-size:.78rem;color:var(--muted)}
.tx .a{font-weight:600}
.tx.in .a{color:var(--inc)} .tx.out .a{color:var(--exp)} .tx.sav .a{color:var(--sav)} .tx.inv .a{color:var(--inv)}
.day{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;margin:14px 0 2px;padding:7px 12px;border-radius:10px;font-size:.8rem;font-weight:700;letter-spacing:.03em;color:var(--fg);
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,var(--surface)),color-mix(in srgb,var(--acc-2) 8%,var(--surface)));border-left:4px solid var(--acc)}
.list>.day:first-child{margin-top:4px}
.day.today{border-left-color:var(--sky);background:linear-gradient(90deg,color-mix(in srgb,var(--sky) 20%,var(--surface)),color-mix(in srgb,var(--sky) 6%,var(--surface)))}
.day-sum{display:flex;gap:10px;align-items:center;font-size:.78rem;letter-spacing:0}
.day-sum .in{color:var(--good)}.day-sum .out{color:var(--bad)}.day-sum .eod{color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:999px}
.bar.inc>i{background:var(--inc)} .bar.inv>i{background:var(--inv)} .bar.exp>i{background:var(--exp)} .bar.sav>i{background:var(--sav)} .bar.over>i{background:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:8px}
.chart-box{position:relative;height:260px;min-width:0}
.chart-box canvas{border-radius:12px}
.mini{--k:var(--acc);background:linear-gradient(160deg,color-mix(in srgb,var(--k) 9%,var(--surface)),var(--surface) 65%);border-color:color-mix(in srgb,var(--k) 24%,var(--line))}
.chart-box.tall{height:320px}
.chart-box.short{height:200px}
.minis{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.minis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{display:grid;gap:6px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.chart-box.mini-box{height:170px}
.funds{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.funds{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.funds{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fund .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:.84rem}
.fund .meta b{display:block;font-weight:600}
.fund .meta span{color:var(--muted);font-size:.74rem}
details>summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:.86rem;list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:10px}
.milestones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ms{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.ms .t{font-size:.74rem;color:var(--muted);font-weight:600}
.stage-list{display:grid;gap:8px}
.stage{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px}
.stage .age{font-family:var(--f-num);font-weight:600;font-size:.95rem;color:var(--acc)}
.stage .fields{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.stage .fields{grid-template-columns:90px 90px 150px 170px minmax(0,1fr) auto}}
.stage .out{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.stage .out b{color:var(--fg)}
.slider{display:grid;gap:4px}
.slider .row b{font-family:var(--f-num);font-weight:600;color:var(--acc)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--acc);height:28px}
.sum3{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:760px){.sum3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sum3>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.big{font-size:1.5rem;font-weight:700}
.note{background:var(--acc-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
.guide{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:.88rem;line-height:1.55}
.guide summary{cursor:pointer;font-weight:600;padding:2px 0}
.guide ol{margin:8px 0 2px;padding-left:20px;display:grid;gap:8px}
.guide ul{margin:4px 0;padding-left:18px}
.gold-box{display:grid;gap:8px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#fef3c7,#fffbeb 60%);border:1px solid #fcd34d;color:#78350f}
.gold-box .hint{color:#92400e}.gold-box a{color:#b45309;font-weight:600}
.gold-in{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.inv-need{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--inv) 9%,var(--surface))}
.inv-need b{font-size:1.1rem;color:var(--inv-ink)}
.proj{display:grid;gap:6px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--inv) 6%,var(--surface));border:1px dashed color-mix(in srgb,var(--inv) 35%,var(--line))}
.proj ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.88rem}
.proj .cmp summary{cursor:pointer;font-weight:600;color:var(--inv-ink);font-size:.88rem}
.proj table{font-size:.82rem;margin-top:6px}.proj tr.cur td{font-weight:700;background:color-mix(in srgb,var(--inv) 12%,transparent)}
.tx-act{display:flex;gap:2px}
.tx .a{text-align:right}.tx .bal{font-size:.74rem;font-weight:500;color:var(--muted);margin-top:1px}.tx .bal.neg{color:var(--bad)}
.bal-now{font-size:.9rem}.bal-now b{font-size:1.05rem}
.bal-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:12px;background:color-mix(in srgb,var(--sky) 9%,var(--surface))}
.bal-bar .recon{display:flex;gap:8px;align-items:center;font-size:.85rem}.bal-bar .recon input{width:170px;padding:5px 8px;text-align:right}
.bal-form{padding:10px;margin-bottom:6px;border-radius:12px;border:1px dashed var(--sky);background:color-mix(in srgb,var(--sky) 6%,var(--surface))}
.tx-edit{padding:10px;margin:4px 0;border-radius:12px;border:1px dashed var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--surface))}
.gold-facts{margin:0;padding-left:0;list-style:none;display:grid;gap:4px;font-size:.88rem}
.gold-box>button{justify-self:start}
:root[data-theme="dark"] .gold-box{background:linear-gradient(135deg,#422006,#1c1917 70%);border-color:#a16207;color:#fde68a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gold-box{background:linear-gradient(135deg,#422006,#1c1917 70%);border-color:#a16207;color:#fde68a}}
.ref-links{display:grid;gap:8px;margin-top:8px}
.ref-g{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ref-t{font-weight:600;min-width:150px}
.ref-g a{display:inline-flex;gap:4px;align-items:center;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid color-mix(in srgb,var(--inv) 35%,var(--line));color:var(--inv-ink);text-decoration:none;font-size:.85rem;transition:transform .15s,background .15s}
.ref-g a:hover{background:color-mix(in srgb,var(--inv) 14%,var(--surface));transform:translateY(-1px)}
.ref-g a span{font-size:.75em;opacity:.7}
.sec-h{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sec-h h2{margin:0;font-size:1.1rem}
.banner{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:.88rem}
.empty{color:var(--muted);font-size:.88rem;padding:8px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s ease}}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid currentColor;color:var(--muted);font:600 10px/1 var(--f-num);margin-left:5px;vertical-align:1px;cursor:help;flex:none;font-style:normal;text-transform:none;letter-spacing:0;user-select:none}
.tip:hover,.tip:focus-visible,.tip[aria-expanded="true"]{color:var(--acc);outline:none;background:var(--acc-soft)}
.lt{display:inline-flex;align-items:center;flex-wrap:wrap}
#tipBox{position:fixed;z-index:30;max-width:min(320px,calc(100vw - 32px));background:var(--fg);color:var(--bg);padding:9px 12px;border-radius:8px;font-size:.82rem;line-height:1.45;pointer-events:none;box-shadow:0 6px 20px rgb(0 0 0/.18)}
#tipBox b{font-family:var(--f-num);font-weight:600}
.fund-actions{display:flex;gap:4px;align-items:center}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);border-radius:1px}
details.edit{border-top:1px solid var(--line);padding-top:10px}

function compact(n){
  const a=Math.abs(n||0), s=n<0?"−":"";
  const f=(x,d)=>x.toLocaleString("vi-VN",{maximumFractionDigits:d});
  if(a>=1e9) return s+f(a/1e9,a>=1e11?0:1)+" tỷ";
  if(a>=1e6) return s+f(a/1e6,a>=1e8?0:1)+" tr";
  if(a>=1e3) return s+f(a/1e3,0)+"k";
  return s+f(a,0);
}

function parseMoney(v){
  if(typeof v==="number") return v;
  let s=String(v||"").trim().toLowerCase().replace(/\s/g,"");
  let mul=1;
  if(/(tỷ|ty|b)$/.test(s)){mul=1e9;s=s.replace(/(tỷ|ty|b)$/,"");}
  else if(/(triệu|trieu|tr|m)$/.test(s)){mul=1e6;s=s.replace(/(triệu|trieu|tr|m)$/,"");}
  else if(/(k|nghìn|ngan|nghin)$/.test(s)){mul=1e3;s=s.replace(/(k|nghìn|ngan|nghin)$/,"");}
  if(mul>1) s=s.replace(",",".").replace(/[^\d.]/g,""); else s=s.replace(/[^\d-]/g,"");
  const n=parseFloat(s); return isFinite(n)? Math.round(n*mul) : 0;
}

function warnToast(list){ const a=[].concat(list).filter(Boolean); if(!a.length) return false; toast("⚠️ "+a.join(" · "),Math.min(9000,4000+a.length*1500),true); return true; }
const isFuture = d => d && parseISO(d) > today;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- công thức tài chính (giống Excel) ---------- */
function FV(r,n,pmt,pv){ // số dương = tiền của bạn
  if(n<=0) return pv;
  if(Math.abs(r)<1e-12) return pv+pmt*n;
  const g=Math.pow(1+r,n); return pv*g + pmt*(g-1)/r;
}
function PMT(r,n,pv,fv,due=0){ // số tiền góp mỗi kỳ để từ pv lên fv
  if(n<=0) return Math.max(0,fv-pv);
  if(Math.abs(r)<1e-12) return (fv-pv)/n;
  const g=Math.pow(1+r,n); return (fv-pv*g)*r/((g-1)*(due?1+r:1));
}

/* ---------- số liệu thu chi ---------- */
function txIn(y,m){ const k=keyYM(y,m); return S.tx.filter(t=>ym(t.date)===k); }
function monthStats(y,m){
  const list=txIn(y,m), o={inc:0,spend:0,save:0,invest:0,byInc:{},byOut:{}};
  INC_GROUPS.forEach(g=>o.byInc[g]=0); OUT_GROUPS.forEach(g=>o.byOut[g]=0);
  for(const t of list){
    if(t.t==="in"){ o.inc+=t.amount; o.byInc[t.group]=(o.byInc[t.group]||0)+t.amount; }
    else { o.byOut[t.group]=(o.byOut[t.group]||0)+t.amount; if(t.group===SAVE_GROUP) o.save+=t.amount; else if(t.group===INV_GROUP) o.invest+=t.amount; else o.spend+=t.amount; }
  }
  // khoản góp quỹ chưa được ghi ở Thu chi vẫn là tiền tiết kiệm của tháng
  const k=keyYM(y,m), txIds=new Set(S.tx.map(t=>t.id)); o.fundSave=0;
  for(const f of S.funds) for(const d of (f.deposits||[])) if(ym(d.date)===k && !(d.txId&&txIds.has(d.txId))) o.fundSave+=Number(d.amount)||0;
  o.txSave=o.save; o.save+=o.fundSave; o.byOut[SAVE_GROUP]+=o.fundSave;
  o.invDep=0; for(const v of S.invs) for(const d of (v.deposits||[])) if(ym(d.date)===k && !(d.txId&&txIds.has(d.txId))) o.invDep+=Number(d.amount)||0;
  o.txInv=o.invest; o.invest+=o.invDep; o.byOut[INV_GROUP]+=o.invDep;
  o.surplus=o.inc-o.spend-o.save-o.invest;
  o.invRate=o.inc? o.invest/o.inc : NaN;
  o.canSaveRate=o.inc? (o.inc-o.spend)/o.inc : NaN;
  o.saveRate=o.inc? o.save/o.inc : NaN;
  return o;
}
function yearStats(y){ const a=[]; for(let m=1;m<=12;m++) a.push(monthStats(y,m)); return a; }
function budgetFor(y){
  const b=S.budgets[y]; const z=()=>Array(12).fill(0);
  const base={inc:{},out:{},save:z(),invest:z()}; INC_GROUPS.forEach(g=>base.inc[g]=z()); EXP_GROUPS.forEach(g=>base.out[g]=z());
  if(!b) return base;
  INC_GROUPS.forEach(g=>{ if(Array.isArray(b.inc?.[g])) base.inc[g]=b.inc[g].map(Number); });
  EXP_GROUPS.forEach(g=>{ if(Array.isArray(b.out?.[g])) base.out[g]=b.out[g].map(Number); });
  if(Array.isArray(b.save)) base.save=b.save.map(Number);
  if(Array.isArray(b.invest)) base.invest=b.invest.map(Number);
  return base;
}

/* ---------- quỹ ---------- */
function fundCalc(f){
  const start=parseISO(f.start);
  const total = f.kind==="emergency" ? Number(f.months||6)
    : (()=>{const e=parseISO(f.end);return (e.getFullYear()-start.getFullYear())*12+e.getMonth()-start.getMonth()+1;})();
  const deadline = f.kind==="emergency" ? addMonths(start,total) : parseISO(f.end);
  const target = f.kind==="emergency" ? Number(f.fixedCost||0)*Number(f.reserveMonths||6) : Number(f.target||0);
  const rate=Number(f.rate||0);
  const deps=[...(f.deposits||[])].sort((a,b)=>a.date<b.date?-1:1);
  let bal=Number(f.initial||0), principal=bal, interest=0, last=null;
  const now = today<deadline? today : deadline;
  for(const d of deps){
    const dd=parseISO(d.date);
    if(last){ const days=Math.max(0,daysBetween(last, dd<now?dd:now)); const i=bal*rate/365*days; bal+=i; interest+=i; }
    bal+=Number(d.amount); principal+=Number(d.amount); last=dd;
  }
  if(last && now>last){ const i=bal*rate/365*daysBetween(last,now); bal+=i; interest+=i; }
  const monthsDone=new Set(deps.filter(d=>d.amount>0).map(d=>ym(d.date))).size;
  const remaining=Math.max(0,total-monthsDone);
  const done=bal>=target && target>0;
  const need = done?0 : remaining>0 ? Math.ceil(Math.max(0,PMT(rate/12,remaining,bal,target,1))/1000)*1000 : Math.ceil(Math.max(0,target-bal)/1000)*1000;
  const withdraw = f.method==="Ngân hàng"? principal+interest : f.method==="MMF"? (principal+interest)*.999 : principal+interest*.95;
  return {total,deadline,target,bal,principal,interest,remaining,done,need,withdraw,progress:target?Math.min(1,bal/target):0,deps};
}

/* ---------- cân đối quỹ tiết kiệm ---------- */
const isFixed = f => (f.priority ?? (f.kind==="emergency"?"fixed":"flex")) === "fixed";
function monthsToReach(bal,target,rate,pmt){ // góp đầu tháng, số tháng tối thiểu để đạt mục tiêu
  if(bal>=target) return 0; if(pmt<=0) return Infinity;
  let b=bal; for(let n=1;n<=600;n++){ b=(b+pmt)*(1+rate/12); if(b>=target-0.5) return n; } return Infinity; }
function balancePlan(rows, idle){
  const act=rows.filter(x=>!x.c.done);
  const fixed=act.filter(x=>isFixed(x.f)), flex=act.filter(x=>!isFixed(x.f));
  const fixedNeed=fixed.reduce((s,x)=>s+x.c.need,0), flexNeed=flex.reduce((s,x)=>s+x.c.need,0);
  const left=Math.max(0,idle-fixedNeed), short=fixedNeed+flexNeed-idle;
  const k=flexNeed? Math.min(1,left/flexNeed) : 1;
  const sug=flex.map(x=>{ const {f,c}=x; const pay=k>=1? c.need : Math.floor(c.need*k/1000)*1000;
    const n=monthsToReach(c.bal,c.target,Number(f.rate||0),pay);
    const base=c.remaining>0? c.deadline : (today>c.deadline? today : c.deadline);
    const extra= k>=1? 0 : (isFinite(n)? n-c.remaining : Infinity);
    return {f,c,pay,n,extra,newEnd:isFinite(extra)? addMonths(base,extra):null}; });
  return {fixed,flex,fixedNeed,flexNeed,left,short,k,sug,fixedOver:fixedNeed>idle};
}
function idleOverWarn(){ const b=budgetFor(S.y), i=S.m-1, sp=INC_GROUPS.reduce((a,g)=>a+b.inc[g][i],0)-EXP_GROUPS.reduce((a,g)=>a+b.out[g][i],0), tot=idleS()+idleI();
  return sp>0&&tot>sp? `<div class="alloc-warn" role="alert" style="margin-bottom:8px">⚠️ <span>Nhàn rỗi tiết kiệm + đầu tư = <b class="num">${vnd(tot)}</b>, lớn hơn thặng dư dự kiến tháng ${S.m} (${vnd(sp)}). Số đang dùng để tính có thể không có thật, hãy kiểm tra tab Ngân sách.</span></div>`:""; }
function balanceCard(rows){
  const idle=idleS(), b=balancePlan(rows,idle);
  if(!b.fixed.length && !b.flex.length) return "";
  const nm=x=>esc(fundName(x.f));
  const fixedRows=b.fixed.map(x=>`<tr><td>📌 ${nm(x)}</td><td class="r num">${vn(x.c.need)}</td><td class="r num">${vn(x.c.need)}</td><td class="r num">${dmy(iso(x.c.deadline))}</td><td class="hint">Giữ nguyên</td></tr>`).join("");
  const flexRows=b.sug.map(s=>`<tr><td>🌿 ${nm(s)}</td><td class="r num">${vn(s.c.need)}</td><td class="r num">${vn(s.pay)}</td><td class="r num">${dmy(iso(s.c.deadline))}</td><td>${s.extra===0?`<span class="hint">Giữ nguyên</span>`:s.newEnd?`<b class="num" style="color:var(--warn)">→ ${dmy(iso(s.newEnd))}</b> <span class="hint">(+${s.extra} tháng)</span>`:`<span style="color:var(--bad)">Tạm dừng góp</span>`}</td></tr>`).join("");
  const canApply=b.short>0 && !b.fixedOver && b.sug.some(s=>s.extra>0&&s.newEnd);
  let msg;
  if(b.short<=0) msg=`Đủ tiền cho mọi quỹ: quỹ cố định cần ${vnd(b.fixedNeed)}, quỹ linh hoạt cần ${vnd(b.flexNeed)}, còn dư <b class="num">${vnd(-b.short)}</b>/tháng.`;
  else if(b.fixedOver) msg=`Riêng quỹ cố định đã cần <b class="num">${vnd(b.fixedNeed)}</b>/tháng, nhiều hơn số nhàn rỗi ${vnd(idle)}. Hãy tăng nhàn rỗi (ở tab Ngân sách) thêm ít nhất <b class="num">${vnd(b.fixedNeed-idle)}</b>, hoặc chuyển bớt một quỹ cố định sang linh hoạt.`;
  else if(!b.flex.length) msg=`Thiếu <b class="num">${vnd(b.short)}</b>/tháng nhưng không có quỹ linh hoạt nào để giãn. Hãy chuyển một quỹ sang linh hoạt hoặc tăng nhàn rỗi.`;
  else msg=`Thiếu <b class="num">${vnd(b.short)}</b>/tháng. ${b.fixed.length?`Quỹ cố định được góp đủ trước (${vnd(b.fixedNeed)}). Phần còn lại`:"Toàn bộ"} <b class="num">${vnd(b.left)}</b> chia cho quỹ linh hoạt theo tỷ lệ, quỹ nào góp ít đi thì giãn hạn tương ứng.`;
  return `<div class="card balance">
    <div class="card-h"><h2 class="lt">Cân đối quỹ theo tiền nhàn rỗi${T("balance")}</h2><span class="hint">Nhàn rỗi ${vnd(idle)}/tháng</span></div>
    ${idleOverWarn()}<p class="hint" style="margin:0 0 8px">${msg}</p>
    <div class="tbl-wrap"><table><thead><tr><th>Quỹ</th><th class="r">Cần góp</th><th class="r">Gợi ý góp</th><th class="r">Hạn hiện tại</th><th>Gợi ý hạn</th></tr></thead>
      <tbody>${fixedRows}${flexRows}</tbody></table></div>
    ${canApply?`<div class="row" style="margin-top:10px"><span class="hint">Chỉ đổi ngày hoàn thành của quỹ linh hoạt, số tiền mục tiêu giữ nguyên.</span><button class="primary" id="applyBalance">Áp dụng gợi ý</button></div>`:""}
  </div>`;
}

// Lãi năm → lãi tháng tương đương (gửi kỳ hạn 12 tháng tái tục: 9,1%/năm ≈ 0,73%/tháng)
const mRate = y => Math.pow(1+Number(y||0),1/12)-1;
const monthsTo = end => { const e=parseISO(end); return Math.max(1,(e.getFullYear()-today.getFullYear())*12+e.getMonth()-today.getMonth()); };
const fvDue = (pv,pmt,r,n) => { if(Math.abs(r)<1e-12) return pv+pmt*n; const g=Math.pow(1+r,n); return pv*g+pmt*(g-1)/r*(1+r); };
const needFor = (v,c,y) => { const m=monthsTo(v.end), r=mRate(y); return Math.ceil(Math.max(0, r? PMT(r,m,c.value,v.target,1) : (v.target-c.value)/m)/1000)*1000; };
function invNeedOf(v,c){ if(Number(v.monthly)>0) return Number(v.monthly);
  if(v.target&&v.end) return needFor(v,c,v.rate); return 0; }
function invProj(v,c){ // dự kiến tương lai với số góp hiện tại
  const pay=invNeedOf(v,c), r=mRate(v.rate); if(!pay&&!Number(v.rate)) return null;
  const out={pay,r};
  if(v.end){ out.m=monthsTo(v.end); out.fvEnd=fvDue(c.value,pay,r,out.m); }
  if(v.target&&c.value<v.target&&(pay>0||r>0)){ let b=c.value,n=0; while(b<v.target&&n<720){ b=(b+pay)*(1+r); n++; } out.reachN=n<720?n:null; out.reachDate=n<720?addMonths(new Date(today.getFullYear(),today.getMonth(),1),n):null; }
  return out; }
const CMP_RATES_DEFAULT=[0.054,0.07,0.075,0.091];
const cmpRates = () => (S.settings.cmpRates&&S.settings.cmpRates.length? S.settings.cmpRates : CMP_RATES_DEFAULT);
function invProjBlock(v,c){
  const pj=invProj(v,c); if(!pj) return "";
  const lines=[];
  if(pj.fvEnd!==undefined) lines.push(`🔮 Góp <b class="num">${compact(pj.pay)}</b>/tháng${Number(v.rate)?`, lãi ${pct(Number(v.rate),1)}/năm`:""} → đến ${dmy(v.end)} có khoảng <b class="num">${vnd(Math.round(pj.fvEnd))}</b>${v.target?(pj.fvEnd>=v.target-1000?` <span style="color:var(--good)">(đủ mục tiêu)</span>`:` <span style="color:var(--bad)">(thiếu ${compact(v.target-pj.fvEnd)})</span>`):""}`);
  if(pj.reachDate) lines.push(`🏁 Đạt mục tiêu ${compact(v.target)} sau khoảng <b class="num">${pj.reachN} tháng</b> (khoảng ${String(pj.reachDate.getMonth()+1).padStart(2,"0")}/${pj.reachDate.getFullYear()})`);
  if(pj.fvEnd!==undefined) lines.push(`💸 Trong đó tiền gốc góp ${compact(c.value+pj.pay*pj.m)}, tiền lãi khoảng <b class="num">${compact(Math.max(0,pj.fvEnd-c.value-pj.pay*pj.m))}</b>`);
  let cmp="";
  if(v.target&&v.end){ const rates=[...new Set([...cmpRates(),Number(v.rate||0)].map(x=>Math.round(x*10000)/10000))].sort((a,b)=>a-b);
    cmp=`<details class="cmp" ${S.openCmp?.has(v.id)?"open":""} data-cmp-box="${esc(v.id)}"><summary>So sánh các mức lãi${T("cmpRates")}</summary>
      <p class="hint" style="margin:6px 0 0">Cột 2: cần góp mỗi tháng để đủ ${compact(v.target)} đúng hạn. Cột 3, 4: nếu vẫn góp ${compact(pj.pay)}/tháng.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Lãi/năm</th><th class="r">Cần góp</th><th class="r">Đến hạn có</th><th class="r">Đủ sau</th></tr></thead><tbody>
      ${rates.map(y=>{const r=mRate(y), fv=fvDue(c.value,pj.pay,r,monthsTo(v.end)); let b=c.value,n=0; while(b<v.target&&n<720&&(pj.pay>0||r>0)){b=(b+pj.pay)*(1+r);n++;}
        return `<tr${Math.abs(y-Number(v.rate||0))<1e-6?` class="cur"`:""}><td class="num">${pct(y,1)}${Math.abs(y-Number(v.rate||0))<1e-6?" ✓":""}</td><td class="r num">${vn(needFor(v,c,y))}</td><td class="r num">${vn(Math.round(fv))}</td><td class="r num">${n&&n<720?n+" th":"—"}</td></tr>`;}).join("")}
      </tbody></table></div>
      <label class="f" style="margin-top:6px">Các mức lãi để so sánh (%/năm, cách nhau bằng dấu ;)<input data-cmp-rates value="${cmpRates().map(x=>(x*100).toLocaleString("vi-VN")).join("; ")}"></label>
    </details>`; }
  return `<div class="proj"><ul>${lines.map(x=>`<li>${x}</li>`).join("")}</ul>${cmp}</div>`;
}
function invBalancePlan(rows, idle){
  const act=rows.map(x=>({...x,need:invNeedOf(x.v,x.c)})).filter(x=>x.need>0);
  const fixed=act.filter(x=>isFixed(x.v)), flex=act.filter(x=>!isFixed(x.v));
  const fixedNeed=fixed.reduce((s,x)=>s+x.need,0), flexNeed=flex.reduce((s,x)=>s+x.need,0);
  const left=Math.max(0,idle-fixedNeed), short=fixedNeed+flexNeed-idle, k=flexNeed?Math.min(1,left/flexNeed):1;
  const sug=flex.map(x=>{ const pay=k>=1?x.need:Math.floor(x.need*k/1000)*1000; let newEnd=null, extra=0;
    if(k<1&&x.v.target&&x.v.end){ if(pay>0){ const m=Math.ceil(Math.max(0,x.v.target-x.c.value)/pay); newEnd=addMonths(new Date(today.getFullYear(),today.getMonth(),parseISO(x.v.end).getDate()),m); extra=Math.max(0,Math.round((newEnd-parseISO(x.v.end))/2629800000)); } else extra=Infinity; }
    return {...x,pay,newEnd,extra}; });
  return {fixed,flex,fixedNeed,flexNeed,left,short,k,sug,fixedOver:fixedNeed>idle,act};
}
function invBalanceCard(rows){
  const idle=idleI(), b=invBalancePlan(rows,idle);
  if(!b.act.length) return `<p class="hint" style="margin:0">Nhập “Góp mỗi tháng” hoặc mục tiêu + hạn cho từng khoản (nút Sửa) để app cân đối với tiền nhàn rỗi cho đầu tư.</p>`;
  const nm=x=>esc(x.v.name||"Khoản đầu tư");
  const fr=b.fixed.map(x=>`<tr><td>📌 ${nm(x)}</td><td class="r num">${vn(x.need)}</td><td class="r num">${vn(x.need)}</td><td class="hint">Giữ nguyên</td></tr>`).join("");
  const xr=b.sug.map(s=>`<tr><td>🌿 ${nm(s)}</td><td class="r num">${vn(s.need)}</td><td class="r num">${vn(s.pay)}</td><td>${s.pay>=s.need?`<span class="hint">Giữ nguyên</span>`:s.pay<=0?`<span style="color:var(--bad)">Tạm dừng góp</span>`:s.newEnd?`<b class="num" style="color:var(--warn)">Hạn → ${dmy(iso(s.newEnd))}</b>`:`<span style="color:var(--warn)">Góp ít lại</span>`}</td></tr>`).join("");
  let msg;
  if(b.short<=0) msg=`Đủ tiền: khoản cố định cần ${vnd(b.fixedNeed)}, khoản linh hoạt cần ${vnd(b.flexNeed)}, còn dư <b class="num">${vnd(-b.short)}</b>/tháng để góp thêm.`;
  else if(b.fixedOver) msg=`Riêng khoản cố định đã cần <b class="num">${vnd(b.fixedNeed)}</b>/tháng, nhiều hơn nhàn rỗi ${vnd(idle)}. Hãy tăng nhàn rỗi thêm ít nhất <b class="num">${vnd(b.fixedNeed-idle)}</b> hoặc chuyển bớt sang linh hoạt.`;
  else if(!b.flex.length) msg=`Thiếu <b class="num">${vnd(b.short)}</b>/tháng nhưng không có khoản linh hoạt nào để giảm.`;
  else msg=`Thiếu <b class="num">${vnd(b.short)}</b>/tháng. ${b.fixed.length?`Khoản cố định được góp đủ trước (${vnd(b.fixedNeed)}), phần còn lại`:"Toàn bộ"} <b class="num">${vnd(b.left)}</b> chia cho khoản linh hoạt theo tỷ lệ.`;
  const canApply=b.short>0&&!b.fixedOver&&b.sug.some(s=>s.pay<s.need&&s.pay>0);
  return `${idleOverWarn()}<p class="hint" style="margin:0 0 8px">${msg}</p>
    <div class="tbl-wrap"><table><thead><tr><th>Khoản</th><th class="r">Dự kiến góp</th><th class="r">Gợi ý góp</th><th>Gợi ý</th></tr></thead><tbody>${fr}${xr}</tbody></table></div>
    ${canApply?`<div class="row" style="margin-top:10px"><span class="hint">Đổi “Góp mỗi tháng” (và hạn nếu có) của khoản linh hoạt.</span><button class="primary" id="applyInvBalance">Áp dụng gợi ý</button></div>`:""}`;
}

/* ---------- kế hoạch hưu trí ---------- */
function retireCalc(p){
  const yearsToRetire=p.retireAge-p.age;
  const annual=p.monthlySpend*12;
  const needFromInv=annual-(p.pension+p.other)*12;
  const totalIncome=needFromInv+(p.pension+p.other)*12;
  const inflAdj=totalIncome*Math.pow(1+p.inflation,yearsToRetire);
  const withdrawPre= totalIncome? inflAdj/(1-p.tax)*(needFromInv/totalIncome) : 0;
  const target= p.withdrawRate? withdrawPre/p.withdrawRate : 0;
  return {yearsToRetire,annual,needFromInv,inflAdj,inflMonthly:inflAdj/12,withdrawPre,withdrawPost:withdrawPre*(1-p.tax),target,
    perYear:PMT(p.rate,yearsToRetire,p.invested,target),perMonth:PMT(p.rate/12,yearsToRetire*12,p.invested,target),perWeek:PMT(p.rate/52,yearsToRetire*52,p.invested,target)};
}
function stagesCalc(p){
  const sc=p.scenarios?.[p.scenario]||{stages:[]}; const ppy=p.freq==="month"?12:52;
  let from=p.age, bal=p.invested; const out=[]; const yearly=[{age:p.age,bal}];
  for(const st of sc.stages){
    const to=Math.max(from,Number(st.to)); const pv=bal+Number(st.lump||0);
    const n=(to-from+1)*ppy, r=Number(st.growth)/ppy, pmt=Number(st.pmt||0);
    const fv=FV(r,n,pmt,pv);
    let b=pv; for(let a=from;a<=to;a++){ b=FV(r,ppy,pmt,b); yearly.push({age:a+1,bal:b}); }
    out.push({...st,from,to,pv,n,contrib:pmt*n,fv,interest:fv-pv-pmt*n});
    bal=fv; from=to+1;
  }

function invCalc(v){
  const deps=[...(v.deposits||[])].sort((a,b)=>a.date<b.date?-1:1), vals=[...(v.valuations||[])].sort((a,b)=>a.date<b.date?-1:1);
  const principal=Number(v.initial||0)+deps.reduce((a,d)=>a+Number(d.amount),0);
  const lv=vals.at(-1); const value= lv? Number(lv.value)+deps.filter(d=>d.date>lv.date).reduce((a,d)=>a+Number(d.amount),0) : principal;
  const gain=value-principal;
  return {deps,vals,lv,principal,value,gain,gainPct:principal?gain/principal:NaN,progress:v.target?Math.min(1,value/v.target):null};
}
function portfolio(){ const rows=S.invs.map(v=>({v,c:invCalc(v)})); return {rows,value:rows.reduce((a,x)=>a+x.c.value,0),principal:rows.reduce((a,x)=>a+x.c.principal,0)}; }
function planNow(p){ // kế hoạch đến hôm nay: góp bao nhiêu, giá trị bao nhiêu
  const st=stagesCalc(p), ppy=st.ppy; const start=parseISO(p.startDate||iso(today));
  const days=Math.max(0,daysBetween(start,today)); let left= ppy===52? Math.floor(days/7) : (today.getFullYear()-start.getFullYear())*12+today.getMonth()-start.getMonth();
  let bal=Number(p.invested||0), contrib=bal;
  for(const s of st.stages){ if(left<=0) break; const k=Math.min(s.n,left); bal=FV(s.growth/ppy,k,s.pmt,bal+Number(s.lump||0)); contrib+=s.pmt*k; left-=k; }
  const cur=st.stages.find(s=>p.age>=s.from&&p.age<=s.to)||st.stages[0];
  return {contrib,value:bal,cur,monthNeed:cur?Math.round(cur.pmt*ppy/12/1000)*1000:0,ppy};
}
function investNeed(){ const p=S.plan||DEFAULT_PLAN; return Math.round(planNow(p).monthNeed); }

function budgetBar(label,actual,plan,cls,isSave){
  const ratio=plan?actual/plan:0; const over=!isSave&&plan&&actual>plan;

  <div class="bar ${over?"over":cls}"><i style="width:${Math.min(100,ratio*100).toFixed(1)}%"></i></div></div>`;
}
function feasPill(need,cap){ return need<=cap? `<span class="pill good">Khả thi</span>` : `<span class="pill bad">Thiếu ${compact(need-cap)}</span>`; }

const idleS = () => idleAuto("save") ? budIdle("save") : (S.settings.idleSave ?? S.settings.idle ?? 0);
const idleI = () => idleAuto("invest") ? budIdle("invest") : (S.settings.idleInv ?? 0);
const idleSrc = k => { const b=budIdle(k), man=S.settings[k==="save"?"idleSaveManual":"idleInvManual"];
  if(idleAuto(k)) return `<span class="s idle-src">Theo Ngân sách tháng ${S.m} · <button class="linkish" data-go="ngansach">sửa</button></span>`;
  if(man && b>0) return `<span class="s idle-src">Đang nhập tay · <button class="linkish" data-idle-auto="${k}">dùng số Ngân sách (${compact(b)})</button></span>`;
  return `<span class="s idle-src">Ngân sách tháng ${S.m} chưa đặt ${k==="save"?"Tiết kiệm":"Đầu tư"} · <button class="linkish" data-go="ngansach">đặt ngay</button></span>`; };

function planSeries(p){ // giá trị kế hoạch theo từng tháng tuổi
  const st=stagesCalc(p), ppy=st.ppy, out=[]; let bal=Number(p.invested||0);
  for(const s of st.stages){ const pv=bal+Number(s.lump||0), months=(s.to-s.from+1)*12;
    for(let m=0;m<=months;m++) out.push({x:s.from+m/12,y:FV(s.growth/ppy,m*ppy/12,s.pmt,pv)}); bal=s.fv; }
  return out;
}
function valueAt(date){ let tot=0; const d0=iso(date);
  for(const v of S.invs){ const deps=(v.deposits||[]).filter(d=>d.date<=d0), vals=(v.valuations||[]).filter(x=>x.date<=d0).sort((a,b)=>a.date<b.date?-1:1), lv=vals.at(-1);
    tot+= lv? Number(lv.value)+deps.filter(d=>d.date>lv.date).reduce((a,d)=>a+Number(d.amount),0) : Number(v.initial||0)+deps.reduce((a,d)=>a+Number(d.amount),0); }
  return tot; }
function actualSeries(p){ // danh mục thực tế, mỗi cuối tháng từ ngày bắt đầu kế hoạch
  const start=parseISO(p.startDate||iso(today)), out=[]; const ageAt=d=>p.age+daysBetween(start,d)/365.25;
  out.push({x:p.age,y:valueAt(new Date(start.getTime()-864e5))});
  for(let d=new Date(start.getFullYear(),start.getMonth()+1,0); d<today; d=new Date(d.getFullYear(),d.getMonth()+2,0)) out.push({x:ageAt(d),y:valueAt(d)});
  out.push({x:ageAt(today),y:valueAt(today)}); return out;
}

function groupDigits(el){
  const v=el.value; if(/[a-zà-ỹ]/i.test(v)||/[.,]\d{0,2}$/.test(v)) return; // đang gõ kiểu 50k, 1.5tr: để nguyên
  const caret=el.selectionStart??v.length; const before=v.slice(0,caret).replace(/\D/g,"").length;
  const neg=el.hasAttribute("data-signed")&&/^\s*[-−]/.test(v);
  let d=v.replace(/\D/g,"").replace(/^0+(?=\d)/,"");
  const out=(neg?"-":"")+d.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  if(out===v) return; el.value=out;
  let pos=neg?1:0, seen=0; while(pos<out.length&&seen<before){ if(/\d/.test(out[pos])) seen++; pos++; }
  try{ el.setSelectionRange(pos,pos); }catch(e){}
}
document.addEventListener("change",e=>{ const t=e.target; if(t.hasAttribute?.("data-money")&&/[a-zà-ỹ]/i.test(t.value)){ const neg=t.hasAttribute("data-signed")&&/^\s*[-−]/.test(t.value); const n=parseMoney(t.value.replace(/^\s*[-−]/,"")); t.value=n?(neg?"-":"")+vn(n):""; } },true);
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.hasAttribute?.("data-money")) groupDigits(t);
  if(t.id==="txAmt"){ const v=parseMoney(t.value); $("#txPreview").textContent= v? "= "+vnd(v) : "Gõ số tiền như 50k, 1.5tr hoặc 2000000."; }
  if(t.id==="txName"){ const map=S.txType==="in"?INC_PRESETS:EXP_PRESETS; const prev=S.tx.filter(x=>x.t===S.txType&&x.name===t.value).at(-1); const g=prev?.group||map[t.value]; if(g) $("#txGroup").value=g; }
  if(t.type==="range"&&t.id.startsWith("s-")){

  const LUCKY=["🧧","🍀","💵","🪙","🧧","✨","💎","🍀"], nl=small?5:9;
  for(let k=0;k<nl;k++){ const d=13+R()*10, x=R()*W;
    out.push(`<span class="fx petal" style="--x0:${x.toFixed(0)}px;--x1:${(x+(R()*160-80)).toFixed(0)}px;--d:${d.toFixed(1)}s;--dl:${(-R()*d).toFixed(1)}s"><i><i class="lucky" style="--s:${(14+R()*10).toFixed(0)}px">${LUCKY[k%LUCKY.length]}</i></i></span>`); }
  // 3) bụi vàng bay lên
  const nd=small?8:16;
  for(let k=0;k<nd;k++){ const d=9+R()*8, x=R()*W;
    out.push(`<span class="fx rise" style="--x0:${x.toFixed(0)}px;--x1:${(x+(R()*80-40)).toFixed(0)}px;--d:${d.toFixed(1)}s;--dl:${(-R()*d).toFixed(1)}s;--s:${(3+R()*4).toFixed(1)}px"><i></i></span>`); }
  // 4) lấp lánh
  const ns=small?8:16;
  for(let k=0;k<ns;k++){ const d=2.4+R()*3;
    out.push(`<span class="fx"><i class="spark" style="--p:translate(${(R()*W).toFixed(0)}px,${(R()*H).toFixed(0)}px);--d:${d.toFixed(1)}s;--dl:${(-R()*d).toFixed(1)}s;font-size:${(10+R()*10).toFixed(0)}px">✦</i></span>`); }
  box.innerHTML=out.join("");
}
// Câu khẳng định tài lộc, thay nhau hiện nhẹ ở cuối màn hình
const AFFIRM=["💰 Tiền đến với mình dễ dàng và liên tục","✨ Mỗi đồng mình tiết kiệm đều sinh sôi nảy nở","🍀 Tài lộc đang trên đường đến","🌱 Mình xứng đáng với sự sung túc","🪙 Tiền vào như nước, tiền ra có kế hoạch","🧧 Hôm nay là một ngày may mắn về tài chính","💎 Mình đang xây dựng sự giàu có từng ngày","🌟 Ví luôn đầy, lòng luôn vui"];
let affT=null, affI=Math.floor(Math.random()*AFFIRM.length);
function runAffirm(){ clearTimeout(affT); const el=$("#affirm"); if(!el) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||document.documentElement.classList.contains("fx-off")){ el.classList.remove("show"); return; }
  const step=()=>{ el.textContent=AFFIRM[affI++%AFFIRM.length]; el.classList.add("show"); affT=setTimeout(()=>{ el.classList.remove("show"); affT=setTimeout(step,14000); },5000); };
  affT=setTimeout(step,2500); }
(()=>{ let off=false; try{ off=localStorage.getItem("fx")==="off"; }catch(e){}
  document.documentElement.classList.toggle("fx-off",off); $("#fxToggle").setAttribute("aria-pressed",String(!off)); buildFx(); runAffirm();
  $("#fxToggle").addEventListener("click",e=>{ e.stopPropagation(); const now=!document.documentElement.classList.toggle("fx-off"); $("#fxToggle").setAttribute("aria-pressed",String(now)); try{localStorage.setItem("fx",now?"on":"off");}catch(_){} buildFx(); runAffirm(); toast(now?"Đã bật hiệu ứng nền":"Đã tắt hiệu ứng nền"); });
  let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(buildFx,300); });
})();
function setSync(txt){ $("#syncState").textContent=txt; }
(async()=>{
  const db = window.claude?.use ? await window.claude.use("db").catch(()=>null) : null;
  if(!db){ setSync("chưa kết nối"); const b=$("#dbBanner"); b.hidden=false; b.textContent="Không kết nối được kho dữ liệu. Hãy mở trang khi đã đăng nhập claude.ai; trong lúc này mọi thay đổi chỉ hiện tạm thời."; return; }
  S.db=db; setSync("đã đồng bộ");
  const err=e=>{ console.warn(e); setSync("mất kết nối"); };
  db.collection("investments").onSnapshot(snap=>{ S.invs=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0)); render(); },err);
  db.collection("tx").onSnapshot(snap=>{ S.tx=snap.docs.map(d=>{const x={id:d.id,...d.data(),amount:Number(d.data().amount)||0}; if(x.group===LEGACY_SAVE) x.group=SAVE_GROUP; return x;}); S.loaded.tx=true; render(); },err);
  db.collection("funds").onSnapshot(snap=>{ S.funds=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id})); sortFunds(); render(); },err);
  db.collection("budget").onSnapshot(snap=>{ S.budgets={}; snap.docs.forEach(d=>S.budgets[d.id]=JSON.parse(JSON.stringify(d.data()))); render(); },err);
  db.doc("cfg/settings").onSnapshot(d=>{ if(d.exists) S.settings=Object.assign({idle:4500000},d.data()); render(); },err);
  db.doc("cfg/plan").onSnapshot(d=>{
    if(d.metadata.hasPendingWrites) return;
    if(d.exists){ const v=JSON.parse(JSON.stringify(d.data())); S.plan=Object.assign(JSON.parse(JSON.stringify(DEFAULT_PLAN)),v); }
    const a=document.activeElement; if(a&&(a.dataset?.plan||a.dataset?.stage!==undefined)) return; render();
  },err);
})();
})();
</script>
